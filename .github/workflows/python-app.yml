name: Python application

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./3_1_LLM_agent
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download and extract Ollama manually
        run: |
          if [ "${{ runner.arch }}" = "X64" ]; then
            ARCH="amd64"
          else
            ARCH="arm64"
          fi

          curl -fsSL "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" -o ollama.tar.zst
          mkdir -p .ollama-install
          tar -C .ollama-install --zstd -xf ollama.tar.zst
          rm ollama.tar.zst

          echo "$(pwd)/.ollama-install/bin" >> $GITHUB_PATH

      - name: Start Ollama Service and Pull Model
        run: |
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1

          ollama serve > ollama.log 2>&1 &

          sleep 5

          ollama pull qwen3:0.6b

      - name: Run tests with coverage
        working-directory: ./3_1_LLM_agent
        env:
          PYTHONPATH: .
        run: |
          coverage run --source=llm_agent -m pytest -v
          coverage report
          coverage json -o ../coverage-data.json

      - name: Create coverage badge JSON
        run: |
          python - <<'PY'
          import json

          with open("coverage-data.json") as f:
              data = json.load(f)

          coverage = round(data["totals"]["percent_covered"], 1)

          if coverage >= 90:
              color = "brightgreen"
          elif coverage >= 75:
              color = "green"
          elif coverage >= 60:
              color = "yellow"
          elif coverage >= 40:
              color = "orange"
          else:
              color = "red"

          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{coverage}%",
              "color": color
          }

          with open("coverage.json", "w") as f:
              json.dump(badge, f, indent=2)

          print(f"Coverage: {coverage}%")
          PY

          rm coverage-data.json

      - name: Update coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coverage.json

          if git diff --cached --quiet; then
            echo "Coverage has not changed"
          else
            git commit -m "Update code coverage badge"
            git push
          fi
