name: Python application

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ./3_1_LLM_agent
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download and extract Ollama manually
        run: |
          if [ "${{ runner.arch }}" = "X64" ]; then
            ARCH="amd64"
          else
            ARCH="arm64"
          fi

          curl -fsSL "https://ollama.com/download/ollama-linux-${ARCH}.tar.zst" -o ollama.tar.zst
          mkdir -p .ollama-install
          tar -C .ollama-install --zstd -xf ollama.tar.zst
          rm ollama.tar.zst

          echo "$(pwd)/.ollama-install/bin" >> $GITHUB_PATH

      - name: Start Ollama Service and Pull Model
        run: |
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1

          ollama serve > ollama.log 2>&1 &

          sleep 5

          ollama pull qwen3.5:0.8b

      - name: Run all tests
        working-directory: ./3_1_LLM_agent
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v
